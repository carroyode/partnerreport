<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synthflow — Partner & Reseller Report</title>

<style>
:root{--p:#5C21FA;--p2:#7C3AFF;--p3:#9F67FF;--dark:#0a0a0f;--mid:#334155;--muted:#64748b;--border:#ede9fe;--light:#f5f3ff;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fafaff;color:var(--dark);font-size:14px}

/* HEADER */
.hdr{background:#fff;border-bottom:1px solid var(--border);padding:32px 48px 28px;position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;top:-60px;right:-80px;width:380px;height:380px;background-image:radial-gradient(circle,#c4b5fd 1.5px,transparent 1.5px);background-size:20px 20px;opacity:.4;pointer-events:none}
.hdr-logo{font-size:20px;font-weight:900;color:var(--p);letter-spacing:-.5px;margin-bottom:10px}
.hdr h1{font-size:26px;font-weight:700;color:var(--dark);margin-bottom:4px}
.hdr-meta{font-size:12px;color:var(--muted)}
.hdr-meta b{color:var(--p)}

/* NAV */
.nav{background:#fff;border-bottom:2px solid var(--border);padding:0 48px;display:flex;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(92,33,250,.06)}
.nav a{display:block;padding:13px 18px;font-size:13px;font-weight:600;color:#94a3b8;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:all .15s}
.nav a:hover,.nav a.on{color:var(--p);border-bottom-color:var(--p)}

/* SECTIONS */
.sec{padding:36px 48px;display:none}
.sec.on{display:block}
.sec-title{font-size:17px;font-weight:700;margin-bottom:4px}
.sec-sub{font-size:12px;color:var(--muted);margin-bottom:24px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:#fff;border-radius:12px;padding:18px 20px;border:1px solid var(--border);cursor:pointer;transition:box-shadow .15s,transform .1s}
.kpi:hover{box-shadow:0 4px 20px rgba(92,33,250,.12);transform:translateY(-1px)}
.kpi.accent{background:linear-gradient(135deg,var(--p),var(--p2));border-color:transparent}
.kpi .lbl{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em}
.kpi.accent .lbl{color:rgba(255,255,255,.7)}
.kpi .val{font-size:28px;font-weight:800;color:var(--dark);margin-top:5px;line-height:1}
.kpi.accent .val{color:#fff}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:3px}
.kpi.accent .sub{color:rgba(255,255,255,.75)}
.kpi .drill{font-size:10px;color:var(--p);margin-top:6px;font-weight:600}
.kpi.accent .drill{color:rgba(255,255,255,.9)}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:20px}
.card h3{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}
.ch{height:220px;position:relative}

/* PARTNER TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;padding:9px 12px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid #f5f3ff;font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:#f5f3ff}
.n{font-weight:600;font-variant-numeric:tabular-nums}

/* BADGES */
.b{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.bw{background:#dcfce7;color:#166534}
.ba{background:#ede9fe;color:#5C21FA}
.bl{background:#fee2e2;color:#991b1b}
.br{background:#fef3c7;color:#92400e}
.bs{background:#f1f5f9;color:#475569}

/* BAR */
.bar-r{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.bar-lbl{width:140px;font-size:12px;color:var(--mid);flex-shrink:0;text-align:right}
.bar-t{flex:1;height:7px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px}
.bar-v{width:65px;font-size:12px;font-weight:600;color:var(--mid);flex-shrink:0}

/* DEAL LIST */
.dl{display:flex;flex-direction:column;gap:7px;max-height:350px;overflow-y:auto}
.di{display:flex;align-items:center;gap:9px;padding:9px 12px;background:#fafaff;border-radius:8px;border:1px solid var(--border)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.di-name{flex:1;font-size:13px;font-weight:500}
.di-meta{font-size:11px;color:var(--muted);min-width:80px}
.di-amt{font-size:13px;font-weight:700;min-width:75px;text-align:right}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(10,10,15,.5);z-index:1000;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:700px;max-width:95vw;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-hdr{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hdr h2{font-size:16px;font-weight:700}
.modal-hdr .close{cursor:pointer;font-size:20px;color:var(--muted);background:none;border:none;line-height:1;padding:4px}
.modal-hdr .close:hover{color:var(--dark)}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.mk{background:var(--light);border-radius:10px;padding:14px 16px;border:1px solid var(--border)}
.mk .lbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em}
.mk .val{font-size:22px;font-weight:800;color:var(--p);margin-top:4px}
.mk .sub{font-size:11px;color:var(--muted)}

/* FOOTER */
.ftr{background:linear-gradient(90deg,#3B0FBE,var(--p),var(--p2));color:rgba(255,255,255,.75);text-align:center;padding:20px;font-size:12px;margin-top:40px}
.ftr b{color:#fff}

@media(max-width:900px){.kpis,.g2{grid-template-columns:1fr 1fr}.sec,.hdr,.nav{padding-left:20px;padding-right:20px}}

/* FILTER BAR */
.fbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 48px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:44px;z-index:99;box-shadow:0 2px 8px rgba(92,33,250,.04)}
.fbar-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.fp{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.fp:hover{border-color:var(--p);color:var(--p)}
.fp.on{background:var(--p);color:#fff;border-color:var(--p)}
.fbar-custom{display:flex;align-items:center;gap:6px;margin-left:8px}
.fbar-custom input[type=date]{padding:4px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;color:var(--dark);background:#fafaff;outline:none;cursor:pointer}
.fbar-custom input[type=date]:focus{border-color:var(--p)}
.fbar-custom .apply{padding:5px 12px;border-radius:20px;background:var(--p);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer}
.fbar-custom .apply:hover{background:var(--p2)}
.fbadge{padding:3px 10px;border-radius:20px;background:#ede9fe;color:var(--p);font-size:11px;font-weight:700;margin-left:4px}
</style>
</head>

// ── FILTER STATE ─────────────────────────────────────────────────────────
let F_START = null, F_END = null;
var PARTNER_DEALS = P_RAW, RESELLER_DEALS = R_RAW, PIPE_DEALS = PP_RAW;

function filterByDate(arr){
  if(!F_START && !F_END) return arr;
  return arr.filter(d=>{
    if(!d.close) return true;
    const dt = new Date(d.close);
    if(F_START && dt < F_START) return false;
    if(F_END && dt > F_END) return false;
    return true;
  });
}

function setFilter(preset){
  const TODAY = new Date('2026-06-03');
  const y = 2026;
  document.querySelectorAll('.fp').forEach(b=>b.classList.remove('on'));
  const btn = document.querySelector(`[data-f="${preset}"]`);
  if(btn) btn.classList.add('on');
  switch(preset){
    case 'all':    F_START=null; F_END=null; break;
    case 'last12': F_START=new Date('2025-06-03'); F_END=new Date('2026-06-03'); break;
    case 'thisyear': F_START=new Date('2026-01-01'); F_END=new Date('2026-12-31'); break;
    case 'lastyear': F_START=new Date('2025-01-01'); F_END=new Date('2025-12-31'); break;
    case 'q1':  F_START=new Date('2026-01-01'); F_END=new Date('2026-03-31'); break;
    case 'q2':  F_START=new Date('2026-04-01'); F_END=new Date('2026-06-30'); break;
    case 'q3':  F_START=new Date('2026-07-01'); F_END=new Date('2026-09-30'); break;
  }
  updateBadge(preset);
  applyFilter();
}

function setCustomFilter(){
  const from = document.getElementById('f-from').value;
  const to   = document.getElementById('f-to').value;
  if(!from && !to) return;
  document.querySelectorAll('.fp').forEach(b=>b.classList.remove('on'));
  F_START = from ? new Date(from) : null;
  F_END   = to   ? new Date(to)   : null;
  const label = (from||'…') + ' → ' + (to||'…');
  const badge = document.getElementById('filter-badge');
  badge.textContent = label; badge.style.display='inline';
  applyFilter();
}

function updateBadge(preset){
  const badge = document.getElementById('filter-badge');
  const labels = {all:'All Time',last12:'Last 12 Months',thisyear:'2026',lastyear:'2025',q1:'Q1 2026',q2:'Q2 2026',q3:'Q3 2026'};
  if(preset==='all'){ badge.style.display='none'; return; }
  badge.textContent = labels[preset]||preset; badge.style.display='inline';
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function stageLabel(s){ return STAGE[s] || s; }
function isWon(s){ const l=stageLabel(s); return l==='Closed Won'; }
function isLost(s){ const l=stageLabel(s); return l==='Closed Lost'||l==='Closed Lost - Churn'; }
function isActive(s){ return !isWon(s)&&!isLost(s); }
function fmt(n,cur='USD'){
  if(!n||n===0) return '—';
  const sym = cur==='EUR'?'€':'$';
  if(n>=1000000) return sym+(n/1000000).toFixed(1)+'M';
  if(n>=1000) return sym+(n/1000).toFixed(0)+'K';
  return sym+n.toLocaleString();
}
function stageBadge(s){
  const l=stageLabel(s);
  const c=STAGE_COLOR[l]||'#e2e8f0';
  return `<span class="b" style="background:${c}22;color:${isWon(s)?'#166534':isLost(s)?'#991b1b':'#334155'}">${l}</span>`;
}

// ── MODAL ─────────────────────────────────────────────────────────────────
function openModal(title, html){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(e){
  if(!e||e.target===document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('open');
}

function dealTable(deals, showPartner=false){
  if(!deals.length) return '<p style="color:#94a3b8;padding:10px 0">No deals found.</p>';
  const active = deals.filter(d=>isActive(d.stage));
  const won = deals.filter(d=>isWon(d.stage));
  const lost = deals.filter(d=>isLost(d.stage));
  const activePipe = active.reduce((s,d)=>s+(d.amount||0),0);
  const wonVal = won.reduce((s,d)=>s+(d.amount||0),0);
  let html = `<div class="modal-kpis">
    <div class="mk"><div class="lbl">Active Pipeline</div><div class="val">${fmt(activePipe)}</div><div class="sub">${active.length} deals</div></div>
    <div class="mk"><div class="lbl">Closed Won</div><div class="val" style="color:#166534">${fmt(wonVal)}</div><div class="sub">${won.length} deals</div></div>
    <div class="mk"><div class="lbl">Closed Lost</div><div class="val" style="color:#991b1b">${lost.reduce((s,d)=>s+(d.amount||0),0)>0?fmt(lost.reduce((s,d)=>s+(d.amount||0),0)):lost.length+' deals'}</div><div class="sub">${lost.length} deals</div></div>
  </div>`;
  html += '<table class="tbl"><thead><tr>';
  html += '<th>Deal</th>';
  if(showPartner) html += '<th>Partner</th>';
  html += '<th>Amount</th><th>Stage</th><th>Close</th></tr></thead><tbody>';
  const sorted = [...deals].sort((a,b)=>{
    if(isActive(a.stage)&&!isActive(b.stage)) return -1;
    if(!isActive(a.stage)&&isActive(b.stage)) return 1;
    return (b.amount||0)-(a.amount||0);
  });
  sorted.forEach(d=>{
    html+=`<tr><td><strong>${d.name}</strong></td>`;
    if(showPartner) html+=`<td>${d.partner||''}</td>`;
    html+=`<td class="n">${d.amount?fmt(d.amount,d.cur||'USD'):'—'}</td><td>${stageBadge(d.stage)}</td><td style="color:var(--muted);font-size:12px">${d.close||''}</td></tr>`;
  });
  html+='</tbody></table>';
  return html;
}

    const wv=t.won.reduce((s,d)=>s+(d.amount||0),0);
    html+=`<tr class="clickable" onclick="openModal('${t.ta} — All Deals',dealTable(PARTNER_DEALS.filter(d=>d.partner==='Avant'&&getTA(d.name)==='${t.ta}')))">
      <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${COLORS[i%COLORS.length]};margin-right:8px"></span><strong>${t.ta}</strong></td>
      <td class="n">${ap?fmt(ap):'—'}</td><td class="n">${wv?fmt(wv):'—'}</td>
      <td>${t.deals.length}</td>
      <td><span class="b ba">${t.active.length}</span></td>
      <td><span class="b bw">${t.won.length}</span></td>
      <td><span class="b bl">${t.lost.length}</span></td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;

  new Chart(document.getElementById('taDonut'),{
    type:'doughnut',
    data:{labels:tas.map(t=>t.ta),datasets:[{data:tas.map(t=>t.deals.length),backgroundColor:COLORS,borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},padding:8,boxWidth:12}}}}
  });
}

// ── RESELLER ──────────────────────────────────────────────────────────────
function renderReseller(){
  const el = document.getElementById('sec-reseller');
  const deals = RESELLER_DEALS;
  const active = deals.filter(d=>isActive(d.stage));
  const won = deals.filter(d=>isWon(d.stage));
  const activePipe = active.reduce((s,d)=>s+(d.amount||0),0);
  const wonVal = won.reduce((s,d)=>s+(d.amount||0),0);

  let html = `
  <div class="sec-title">Reseller Pipeline</div>
  <div class="sec-sub">Deals where Deal Motion = Reseller — companies buying Synthflow minutes and reselling to their own customers. Click cards to drill in.</div>
  <div class="kpis">
    <div class="kpi accent" onclick="openModal('Active Reseller Deals', dealTable(RESELLER_DEALS.filter(d=>isActive(d.stage))))">
      <div class="lbl">Active Pipeline</div><div class="val">${fmt(activePipe)}</div>
      <div class="sub">${active.length} open deals</div><div class="drill">▸ Click to see deals</div>
    </div>
    <div class="kpi" onclick="openModal('Reseller — Closed Won (All Time)', dealTable(RESELLER_DEALS.filter(d=>isWon(d.stage))))">
      <div class="lbl">Closed Won (All Time)</div><div class="val">${fmt(wonVal)}</div>
      <div class="sub">${won.length} deals</div><div class="drill" style="color:var(--p)">▸ Click to see deals</div>
    </div>
    <div class="kpi" onclick="openModal('All Reseller Deals', dealTable(RESELLER_DEALS))">
      <div class="lbl">Total Reseller Deals</div><div class="val">${deals.length}</div>
      <div class="sub">all time</div><div class="drill" style="color:var(--p)">▸ Click to see deals</div>
    </div>
    <div class="kpi">
      <div class="lbl">Win Rate</div><div class="val">${Math.round(won.length/deals.length*100)}%</div>
      <div class="sub">by deal count</div>
    </div>
  </div>
  <div class="g2">
    <div class="card"><h3>Active Deals</h3><div class="dl">`;

  active.sort((a,b)=>(b.amount||0)-(a.amount||0)).forEach(d=>{
    const c=STAGE_COLOR[stageLabel(d.stage)]||'#a78bfa';
    html+=`<div class="di"><div class="dot" style="background:${c}"></div><div class="di-name">${d.name}</div><div class="di-meta">${stageBadge(d.stage)}</div><div class="di-amt">${fmt(d.amount,d.cur)}</div></div>`;
  });

  html+=`</div></div>
    <div class="card"><h3>Top Won Deals</h3><div class="dl">`;
  won.sort((a,b)=>(b.amount||0)-(a.amount||0)).slice(0,10).forEach(d=>{
    html+=`<div class="di"><div class="dot" style="background:#4ade80"></div><div class="di-name">${d.name}</div><div class="di-meta"><span class="b bw">Won</span></div><div class="di-amt">${fmt(d.amount,d.cur)}</div></div>`;
  });
  html+=`</div></div></div></div>`;
  el.innerHTML=html;
}

// ── PARTNERSHIPS ──────────────────────────────────────────────────────────
function renderPartnerships(){
  const el = document.getElementById('sec-partnerships');
  const deals = PIPE_DEALS;
  const active = deals.filter(d=>isActive(d.stage));
  const won = deals.filter(d=>isWon(d.stage));
  const lost = deals.filter(d=>isLost(d.stage));

  const stageCounts={};
  deals.forEach(d=>{ const l=stageLabel(d.stage); stageCounts[l]=(stageCounts[l]||0)+1; });

  let html = `
  <div class="sec-title">Partnerships Pipeline</div>
  <div class="sec-sub">Partnership development — BPOs, tech partners, channel agents. Click cards to drill in.</div>
  <div class="kpis">
    <div class="kpi accent" onclick="openModal('All Active Partnerships', dealTable(PIPE_DEALS.filter(d=>isActive(d.stage))))">
      <div class="lbl">Total in Pipeline</div><div class="val">${deals.length}</div>
      <div class="sub">partnership opportunities</div><div class="drill">▸ Click to see all</div>
    </div>
    <div class="kpi" onclick="openModal('Active Partnerships', dealTable(PIPE_DEALS.filter(d=>isActive(d.stage))))">
      <div class="lbl">Active</div><div class="val">${active.length}</div>
      <div class="sub">in progress</div><div class="drill" style="color:var(--p)">▸ Click to see deals</div>
    </div>
    <div class="kpi" onclick="openModal('Partnerships — Closed Won', dealTable(PIPE_DEALS.filter(d=>isWon(d.stage))))">
      <div class="lbl">Closed Won</div><div class="val">${won.length}</div>
      <div class="sub">partnerships signed</div><div class="drill" style="color:var(--p)">▸ Click to see deals</div>
    </div>
    <div class="kpi" onclick="openModal('Partnerships — Closed Lost', dealTable(PIPE_DEALS.filter(d=>isLost(d.stage))))">
      <div class="lbl">Closed Lost</div><div class="val">${lost.length}</div>
      <div class="sub">not pursued</div><div class="drill" style="color:var(--p)">▸ Click to see deals</div>
    </div>
  </div>
  <div class="g2">
    <div class="card"><h3>Pipeline Funnel</h3><div style="padding-top:6px">`;

  const stageOrder=['Qualification','Discovery','Evaluation','Negotiation','Contract Sent','Closed Won','Closed Lost'];
  const maxStage = Math.max(...Object.values(stageCounts),1);
  stageOrder.forEach(s=>{
    const n=stageCounts[s]||0;
    if(!n) return;
    const pct=n/maxStage*100;
    const c=STAGE_COLOR[s]||'#cbd5e1';
    html+=`<div class="bar-r" style="cursor:pointer" onclick="openModal('${s} — Partnerships',dealTable(PIPE_DEALS.filter(d=>stageLabel(d.stage)==='${s}')))">
      <div class="bar-lbl">${s}</div>
      <div class="bar-t"><div class="bar-f" style="width:${Math.max(pct,3)}%;background:${c}"></div></div>
      <div class="bar-v">${n} deal${n>1?'s':''}</div>
    </div>`;
  });

  html+=`</div></div>
    <div class="card"><h3>Stage Distribution</h3><div class="ch"><canvas id="pipeStageChart"></canvas></div></div>
  </div>`;
  el.innerHTML=html;

  const se=Object.entries(stageCounts);
  new Chart(document.getElementById('pipeStageChart'),{
    type:'doughnut',
    data:{labels:se.map(e=>e[0]),datasets:[{data:se.map(e=>e[1]),backgroundColor:se.map(e=>STAGE_COLOR[e[0]]||'#cbd5e1'),borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},padding:8,boxWidth:12}}}}
  });
}

// ── TABS ──────────────────────────────────────────────────────────────────
function showSec(id,el){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('on'));
  document.getElementById('sec-'+id).classList.add('on');
  el.classList.add('on');
}

applyFilter();
</script>
